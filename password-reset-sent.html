<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Check your email — HAWA DENNIS</title>
  <link rel="stylesheet" href="forgot-password.css">
  <style>
    .success-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9f8ef;
      color: #21864b;
      font-size: 28px;
      font-weight: 700;
    }
    .auth-card { text-align: center; }
    .auth-card h2 { margin-bottom: 12px; }
    .auth-card-sub { line-height: 1.6; margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="auth-container">
    <header class="auth-header">
      <h1>HAWA <span style="color: #ffc107;">DENNIS</span></h1>
      <p>Password reset</p>
    </header>
    <section class="auth-card" aria-labelledby="success-title">
      <div class="success-icon" aria-hidden="true">✓</div>
      <h2 id="success-title">Check your email</h2>
      <p class="auth-card-sub">If an account exists with this email address, we've sent a password reset link. Please check your inbox and spam folder.</p>
      <a href="user-auth.html" class="back-link">← Back to sign in</a>
    </section>
  </main>
</body>
</html>
